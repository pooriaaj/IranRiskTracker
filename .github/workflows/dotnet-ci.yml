name: .NET CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          # Projects target net10.0 - install .NET 10 SDK
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./IranRiskTracker.slnx

      - name: Build
        run: dotnet build ./IranRiskTracker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./IranRiskTracker.slnx --configuration Release --no-build --verbosity normal
